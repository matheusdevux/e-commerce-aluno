<mat-toolbar class="teste"> 

<button mat-button class="teste2" routerLink="/"><span>{{ nomeLoja |uppercase }}</span></button>
<span class="flex-spacer"></span>

<button mat-button routerLink="/">Início</button>

<button mat-button routerLink="/carrinho">Carrinho ( {{ quantidadeHeader() }} )</button>

}
